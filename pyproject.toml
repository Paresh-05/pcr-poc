[project]
name = "dtc-bot"
version = "0.1.0"
description = "DTC diagnosis assistant: past-case retrieval + manual + LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "pgvector>=0.3.6",
    "pymupdf>=1.25.0",
    "pypdf>=5.1.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
